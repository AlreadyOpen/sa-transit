# Weekly bake and publish (bake.py, publish.py), then the Kaggle mirror and the monthly live-feed archive (kaggle_archive.py).
# Adelaide Metro republishes the static feed at service changes (feed_info.txt states its validity); weekly is enough for a map.
# Each run commits status/last-run.json: GitHub turns schedules off after 60 days with no commits (live.yml relies on it too).
name: bake
on:
  schedule:
    - cron: '0 18 * * 1'           # Mondays 18:00 UTC (Tuesday 03:30-04:30 in Adelaide)
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the publish gate finds a count drop (a real drop, checked by hand)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIPELINE_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -q
      # tippecanoe 2.79.0 from source (apt's 2.49 drops features; same pin and cache key as world-airports)
      - id: tip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: /opt/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04
      - if: steps.tip.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q https://github.com/felt/tippecanoe /tmp/tip && git -C /tmp/tip checkout -q 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C /tmp/tip -j"$(nproc)" PREFIX=/opt/tippecanoe && sudo make -C /tmp/tip install PREFIX=/opt/tippecanoe
      - run: echo /opt/tippecanoe/bin >> "$GITHUB_PATH"
      - name: bake
        run: python bake.py
      - name: publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: set -o pipefail; mkdir -p status && python publish.py | tee status/last-run.json   # git keeps no empty folder: mkdir first
      # Kaggle mirror of everything published (Helen's account). Its own step, allowed to fail: never blocks Hugging Face.
      - name: mirror to Kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggle_mirror.py
      # complete months of live snapshots (each feed) -> one Kaggle dataset each; removed from the bucket only once Kaggle lists them
      - name: archive live feeds to Kaggle
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggle_archive.py
      - name: keep-alive commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/last-run.json
          git commit -m "bake $(date -u +%F)" || exit 0
          git pull --rebase -q && git push   # main may have moved during the run
